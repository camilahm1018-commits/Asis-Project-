[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra
markers =
    regression: comprueba comportamientos que deben conservarse
    integration: integra FastAPI y SQLModel en una base temporal en memoria
    performance: micropruebas de tiempo (no sustituyen las pruebas de carga)
    live: pruebas HTTP de solo lectura contra ASIS en ejecución (opt-in)
