version: '3.8'

services:
  # === BASE DE DATOS POSTGRESQL ===
  db:
    image: postgres:15-alpine
    container_name: asis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: asisdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # ESTA ES LA LÍNEA NUEVA QUE VINCULA EL SCRIPT PARA INSERTAR LOS DATOS EN EL MOMENTO DE INICIAR EL DOCKER
      - ./base_de_datos/insert_datos.sql:/docker-entrypoint-initdb.d/insert_datos.sql

  # === BACKEND FASTAPI ===
  backend:
    build: ./Backend
    container_name: asis_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
        DATABASE_URL: postgresql+psycopg2://postgres:1234@db:5432/asisdb
    volumes:
      - ./Backend:/app
    depends_on:
      - db

  # === FRONTEND REACT + VITE ===
  frontend:
    build: ./FrontEnd
    container_name: asis_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./FrontEnd:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

  